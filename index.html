<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #1e1e2e;
    color: #f0f0f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  h1 {
    margin: 0;
    letter-spacing: 2px;
  }

  #score {
    font-size: 1.25rem;
    font-weight: bold;
  }

  #game-wrapper {
    position: relative;
  }

  canvas {
    background: #12121c;
    border: 4px solid #444466;
    border-radius: 8px;
    display: block;
  }

  #game-over {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(0, 0, 0, 0.75);
    border-radius: 4px;
    text-align: center;
  }

  #game-over.visible {
    display: flex;
  }

  #game-over h2 {
    margin: 0;
    color: #ff5555;
    font-size: 2rem;
  }

  #restart-btn {
    padding: 8px 20px;
    font-size: 1rem;
    background: #6272a4;
    color: #f0f0f0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  #restart-btn:hover {
    background: #7284b8;
  }

  #hint {
    font-size: 0.9rem;
    color: #aaaaaa;
  }
</style>
</head>
<body>

  <h1>Snake</h1>
  <div id="score">Punkte: 0</div>

  <div id="game-wrapper">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="game-over">
      <h2>Game Over</h2>
      <div id="final-score"></div>
      <button id="restart-btn">Neu starten</button>
    </div>
  </div>

  <div id="hint">Steuerung: Pfeiltasten</div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const gameOverEl = document.getElementById('game-over');
  const finalScoreEl = document.getElementById('final-score');
  const restartBtn = document.getElementById('restart-btn');

  const GRID_SIZE = 20;
  const TILE_COUNT = canvas.width / GRID_SIZE;
  const GAME_SPEED_MS = 120;

  let snake, direction, nextDirection, food, score, gameLoop, isGameOver;

  function init() {
    snake = [{ x: 8, y: 10 }];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    isGameOver = false;
    placeFood();
    updateScore();
    gameOverEl.classList.remove('visible');

    if (gameLoop) clearInterval(gameLoop);
    gameLoop = setInterval(tick, GAME_SPEED_MS);
  }

  function placeFood() {
    let position;
    do {
      position = {
        x: Math.floor(Math.random() * TILE_COUNT),
        y: Math.floor(Math.random() * TILE_COUNT)
      };
    } while (snake.some(segment => segment.x === position.x && segment.y === position.y));
    food = position;
  }

  function updateScore() {
    scoreEl.textContent = `Punkte: ${score}`;
  }

  function tick() {
    direction = nextDirection;

    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    if (
      head.x < 0 || head.x >= TILE_COUNT ||
      head.y < 0 || head.y >= TILE_COUNT ||
      snake.some(segment => segment.x === head.x && segment.y === head.y)
    ) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      updateScore();
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.fillStyle = '#12121c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ff5555';
    ctx.fillRect(food.x * GRID_SIZE, food.y * GRID_SIZE, GRID_SIZE - 1, GRID_SIZE - 1);

    snake.forEach((segment, index) => {
      ctx.fillStyle = index === 0 ? '#50fa7b' : '#42c96a';
      ctx.fillRect(segment.x * GRID_SIZE, segment.y * GRID_SIZE, GRID_SIZE - 1, GRID_SIZE - 1);
    });
  }

  function endGame() {
    isGameOver = true;
    clearInterval(gameLoop);
    finalScoreEl.textContent = `Erreichte Punkte: ${score}`;
    gameOverEl.classList.add('visible');
  }

  document.addEventListener('keydown', (event) => {
    switch (event.key) {
      case 'ArrowUp':
        if (direction.y === 0) nextDirection = { x: 0, y: -1 };
        break;
      case 'ArrowDown':
        if (direction.y === 0) nextDirection = { x: 0, y: 1 };
        break;
      case 'ArrowLeft':
        if (direction.x === 0) nextDirection = { x: -1, y: 0 };
        break;
      case 'ArrowRight':
        if (direction.x === 0) nextDirection = { x: 1, y: 0 };
        break;
    }
  });

  restartBtn.addEventListener('click', init);

  init();
  draw();
</script>

</body>
</html>
