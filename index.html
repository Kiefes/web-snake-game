<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #000000;
    color: #f0f0f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  h1 {
    margin: 0;
    letter-spacing: 2px;
  }

  #score {
    font-size: 1.25rem;
    font-weight: bold;
  }

  #highscore {
    font-size: 0.95rem;
    color: #aaaaaa;
  }

  #game-wrapper {
    position: relative;
  }

  canvas {
    background: #f1f1f1;
    border: 4px solid #e63946;
    border-radius: 8px;
    display: block;
  }

  #game-over {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(0, 0, 0, 0.75);
    border-radius: 4px;
    text-align: center;
  }

  #game-over.visible {
    display: flex;
  }

  #game-over h2 {
    margin: 0;
    color: #ff5555;
    font-size: 2rem;
  }

  #restart-btn {
    padding: 8px 20px;
    font-size: 1rem;
    background: #6272a4;
    color: #f0f0f0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  #restart-btn:hover {
    background: #7284b8;
  }

  #hint {
    font-size: 0.9rem;
    color: #aaaaaa;
  }

  #button-row {
    display: flex;
    gap: 12px;
  }

  #settings-btn,
  #pause-btn {
    padding: 6px 16px;
    font-size: 0.9rem;
    background: #6272a4;
    color: #f0f0f0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  #settings-btn:hover,
  #pause-btn:hover {
    background: #7284b8;
  }

  #pause-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 4px;
  }

  #pause-overlay.visible {
    display: flex;
  }

  #pause-overlay h2 {
    margin: 0;
    color: #f0f0f0;
    font-size: 2rem;
    letter-spacing: 2px;
  }

  #settings-panel {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.6);
    z-index: 10;
  }

  #settings-panel.visible {
    display: flex;
  }

  #settings-panel .panel-content {
    background: #1e1e2e;
    padding: 24px 32px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 220px;
  }

  #settings-panel h2 {
    margin: 0;
  }

  #settings-panel label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    font-size: 0.95rem;
  }

  #settings-panel input[type="color"] {
    width: 48px;
    height: 32px;
    padding: 0;
    border: none;
    border-radius: 4px;
    background: none;
    cursor: pointer;
  }

  #settings-close-btn {
    padding: 8px 20px;
    font-size: 1rem;
    background: #6272a4;
    color: #f0f0f0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    align-self: flex-end;
  }

  #settings-close-btn:hover {

<body>

  <h1>Snake</h1>
  <div id="score">Punkte: 0</div>
  <div id="highscore">Highscore: 0</div>

  <div id="game-wrapper">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="game-over">
      <h2>Game Over</h2>
      <div id="final-score"></div>
      <button id="restart-btn">Neu starten</button>
    </div>
    <div id="pause-overlay">
      <h2>Pausiert</h2>
    </div>
  </div>

  <div id="hint">Steuerung: Pfeiltasten, Leertaste: Pause</div>

  <div id="button-row">
    <button id="pause-btn">⏸ Pause</button>
    <button id="settings-btn">⚙ Einstellungen</button>
  </div>

  <div id="settings-panel">
    <div class="panel-content">
      <h2>Einstellungen</h2>
      <label>Kopf-Farbe <input type="color" id="head-color"></label>
      <label>Körper-Farbe <input type="color" id="body-color"></label>
      <label>Futter-Farbe <input type="color" id="food-color"></label>
      <button id="settings-close-btn">Schließen</button>
    </div>
  </div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highscoreEl = document.getElementById('highscore');
  const gameOverEl = document.getElementById('game-over');
  const finalScoreEl = document.getElementById('final-score');
  const restartBtn = document.getElementById('restart-btn');
  const pauseOverlayEl = document.getElementById('pause-overlay');
  const pauseBtn = document.getElementById('pause-btn');
  const settingsBtn = document.getElementById('settings-btn');
  const settingsPanel = document.getElementById('settings-panel');
  const settingsCloseBtn = document.getElementById('settings-close-btn');
  const headColorInput = document.getElementById('head-color');
  const bodyColorInput = document.getElementById('body-color');
  const foodColorInput = document.getElementById('food-color');

  const GRID_SIZE = 20;
  const TILE_COUNT = canvas.width / GRID_SIZE;
  const GAME_SPEED_MS = 120;
  const HIGHSCORE_KEY = 'snake-highscore';
  const COLORS_KEY = 'snake-colors';
  const DEFAULT_COLORS = { head: '#50fa7b', body: '#42c96a', food: '#ff5555' };
  const PLAYFIELD_BG = '#f1f1f1';
  const GRID_DOT_COLOR = '#d0d0d0';

  let snake, direction, nextDirection, food, score, gameLoop, isGameOver, isPaused;
  let highscore = Number(localStorage.getItem(HIGHSCORE_KEY)) || 0;
  let colors = loadColors();

  function loadColors() {
    try {
      const stored = JSON.parse(localStorage.getItem(COLORS_KEY));
      if (stored && stored.head && stored.body && stored.food) return stored;
    } catch (e) {
      // ignore malformed stored value, fall back to defaults
    }
    return { ...DEFAULT_COLORS };
  }

  function saveColors() {
    localStorage.setItem(COLORS_KEY, JSON.stringify(colors));
  }

  headColorInput.value = colors.head;
  bodyColorInput.value = colors.body;
  foodColorInput.value = colors.food;

  function init() {
    snake = [{ x: 8, y: 10 }];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    isGameOver = false;
    isPaused = false;
    placeFood();
    updateScore();
    updateHighscoreDisplay();
    gameOverEl.classList.remove('visible');
    pauseOverlayEl.classList.remove('visible');
    pauseBtn.textContent = '⏸ Pause';

    if (gameLoop) clearInterval(gameLoop);
    gameLoop = setInterval(tick, GAME_SPEED_MS);
  }

  function togglePause() {
    if (isGameOver) return;

    isPaused = !isPaused;
    if (isPaused) {
      clearInterval(gameLoop);
      pauseOverlayEl.classList.add('visible');
      pauseBtn.textContent = '▶ Fortsetzen';
    } else {
      gameLoop = setInterval(tick, GAME_SPEED_MS);
      pauseOverlayEl.classList.remove('visible');
      pauseBtn.textContent = '⏸ Pause';
    }
  }

  function placeFood() {
    let position;
    do {
      position = {
        x: Math.floor(Math.random() * TILE_COUNT),
        y: Math.floor(Math.random() * TILE_COUNT)
      };
    } while (snake.some(segment => segment.x === position.x && segment.y === position.y));
    food = position;
  }

  function updateScore() {
    scoreEl.textContent = `Punkte: ${score}`;
  }

  function updateHighscoreDisplay() {
    highscoreEl.textContent = `Highscore: ${highscore}`;
  }

  function tick() {
    direction = nextDirection;

    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    if (
      head.x < 0 || head.x >= TILE_COUNT ||
      head.y < 0 || head.y >= TILE_COUNT ||
      snake.some(segment => segment.x === head.x && segment.y === head.y)
    ) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      updateScore();
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.fillStyle = PLAYFIELD_BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = GRID_DOT_COLOR;
    for (let x = 0; x < TILE_COUNT; x++) {
      for (let y = 0; y < TILE_COUNT; y++) {
        ctx.beginPath();
        ctx.arc(x * GRID_SIZE + GRID_SIZE / 2, y * GRID_SIZE + GRID_SIZE / 2, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.fillStyle = colors.food;
    ctx.fillRect(food.x * GRID_SIZE, food.y * GRID_SIZE, GRID_SIZE - 1, GRID_SIZE - 1);

    snake.forEach((segment, index) => {
      ctx.fillStyle = index === 0 ? colors.head : colors.body;
      ctx.fillRect(segment.x * GRID_SIZE, segment.y * GRID_SIZE, GRID_SIZE - 1, GRID_SIZE - 1);
    });
  }

  function endGame() {
    isGameOver = true;
    clearInterval(gameLoop);

    const isNewHighscore = score > highscore;
    if (isNewHighscore) {
      highscore = score;
      localStorage.setItem(HIGHSCORE_KEY, String(highscore));
      updateHighscoreDisplay();
    }

    finalScoreEl.textContent = isNewHighscore
      ? `Erreichte Punkte: ${score} — Neuer Highscore!`
      : `Erreichte Punkte: ${score}`;
    gameOverEl.classList.add('visible');
  }

  document.addEventListener('keydown', (event) => {
    if (event.code === 'Space') {
      event.preventDefault();
      togglePause();
      return;
    }

    if (isPaused) return;

    switch (event.key) {
      case 'ArrowUp':
        if (direction.y === 0) nextDirection = { x: 0, y: -1 };
        break;
      case 'ArrowDown':
        if (direction.y === 0) nextDirection = { x: 0, y: 1 };
        break;
      case 'ArrowLeft':
        if (direction.x === 0) nextDirection = { x: -1, y: 0 };
        break;
      case 'ArrowRight':
        if (direction.x === 0) nextDirection = { x: 1, y: 0 };
        break;
    }
  });

  restartBtn.addEventListener('click', init);
  pauseBtn.addEventListener('click', togglePause);

  settingsBtn.addEventListener('click', () => settingsPanel.classList.add('visible'));
  settingsCloseBtn.addEventListener('click', () => settingsPanel.classList.remove('visible'));

  headColorInput.addEventListener('input', () => {
    colors.head = headColorInput.value;
    saveColors();
    draw();
  });

  bodyColorInput.addEventListener('input', () => {
    colors.body = bodyColorInput.value;
    saveColors();
    draw();
  });

  foodColorInput.addEventListener('input', () => {
    colors.food = foodColorInput.value;
    saveColors();
    draw();
  });

  init();
  draw();
</script>

  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };

</body>
